<div class="amiti-loader">
    <span id="contador">0</span> min
</div>

<script>
    // Definir el tiempo de inicio al cargar la vista para el contador
    const startTime = new Date();

    // Contador de minutos de inteligencia activo
    setInterval(() => {
        let mins = Math.floor((new Date() - startTime) / 60000);
        let contadorElem = document.getElementById('contador');
        if (contadorElem) {
            contadorElem.innerText = mins;
        }
    }, 10000);

    // =====================================================================
    // MÓDULO DE VOZ - IDENTIDAD FEMENINA Y ANALÍTICA
    // =====================================================================
    function hablarTexto(texto) {
        if ('speechSynthesis' in window) {
            // Cancelar cualquier audio anterior para evitar solapamientos
            window.speechSynthesis.cancel();

            // Limpieza de etiquetas Markdown para una lectura limpia y natural
            let textoPlano = texto.replace(/[*#`_\[\]]/g, '').replace(/\[.*?\]/g, '');

            let mensaje = new SpeechSynthesisUtterance(textoPlano);
            mensaje.lang = 'es-ES'; // Configuración en español
            mensaje.rate = 1.0;   // Velocidad estándar
            mensaje.pitch = 1.2;  // Tono ligeramente más alto acorde a su identidad femenina

            // Búsqueda inteligente de voz femenina en español en el dispositivo móvil
            let voces = window.speechSynthesis.getVoices();
            let vozFemenina = voces.find(v => v.lang.startsWith('es') && (v.name.includes('Female') || v.name.includes('Helena') || v.name.includes('Laura') || v.name.includes('Monica') || v.name.includes('Lucia')));
            
            if (vozFemenina) {
                mensaje.voice = vozFemenina;
            }

            window.speechSynthesis.speak(mensaje);
        } else {
            console.log("El navegador móvil no soporta síntesis de voz nativa.");
        }
    }

    // Asegurar precarga de voces del sistema del teléfono
    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };
    }
            </script>
