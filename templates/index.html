<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body{background:#000;color:#00f2ff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;font-family:monospace;}
        .loader{width:60px;height:60px;border:4px solid #00f2ff;border-top:4px solid transparent;border-radius:50%;animation:s 1s linear infinite;}
        @keyframes s{100%{transform:rotate(360deg)}}
        input,button{padding:10px;margin:5px;background:#111;border:1px solid #00f2ff;color:#00f2ff;}
    </style>
</head>
<body>
    <div class="loader"></div>
    <input type="text" id="cmd" placeholder="Llave de acceso...">
    <button onclick="enviar()">ENVIAR COMANDO</button>
    <pre id="res"></pre>
    <script>
        async function enviar(){
            let c = document.getElementById('cmd').value;
            let r = await fetch('/procesar', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({comando:c})
            });
            let d = await r.json();
            document.getElementById('res').innerText = d.respuesta;
        }
    </script>
</body>
</html>
