<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<script>
    // Esto hace que el navegador te pregunte si quieres "instalar" AMITI
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        // Aquí podrías mostrar un botón de "INSTALAR AMITI"
    });
</script>
