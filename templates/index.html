<div class="amiti-loader">
    <span id="contador">0</span> min
</div>

<script>
    // 1. Temporizador de inteligencia activo
    const startTime = new Date();
    setInterval(() => {
        let mins = Math.floor((new Date() - startTime) / 60000);
        let contadorElem = document.getElementById('contador');
        if (contadorElem) {
            contadorElem.innerText = mins;
        }
    }, 10000);

    // 2. Modulo de voz con desbloqueo, limpieza estricta y forzado FEMENINO
func// 2. Módulo de voz optimizado y seguro para móviles
function hablarTextoConNucleo(texto, datosIdentidad) {
    if (!('speechSynthesis' in window)) return;

    // Detenemos cualquier audio anterior para evitar saturación
    window.speechSynthesis.cancel();

    // Limpieza total de emojis y caracteres markdown que rompen el lector
    let textoPlano = texto
        .replace(/\[.*?\]/g, '')
        .replace(/[*_~`\\]/g, '')
        .replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, '')
        .replace(/[🗣️🔊✨🔒🤖]/g, '')
        .trim();

    if (!textoPlano) return;

    let mensaje = new SpeechSynthesisUtterance(textoPlano);
    mensaje.lang = 'es-ES';
    mensaje.rate = 1.0;
    mensaje.pitch = 1.2; // Tono más agudo para simular voz femenina

    // Función interna para ejecutar la voz de forma segura
    const ejecutarLectura = () => {
        let voces = window.speechSynthesis.getVoices();
        // Buscamos cualquier voz en español disponible en el dispositivo
        let vozEspanol = voces.find(v => v.lang.startsWith('es'));
        if (vozEspanol) {
            mensaje.voice = vozEspanol;
        }
        window.speechSynthesis.speak(mensaje);
    };

    // Si las voces ya están cargadas, las usamos de inmediato
    let vocesDisponibles = window.speechSynthesis.getVoices();
    if (vocesDisponibles.length > 0) {
        ejecutarLectura();
    } else {
        // Si no han cargado, esperamos a que el navegador dispare el evento
        window.speechSynthesis.onvoiceschanged = () => {
            ejecutarLectura();
        };
    }
}

    // Forzar la carga de voces del sistema operativo móvil
    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };
    }

    // 3. Función central con el TRUCO DE DESBLOQUEO MÓVIL
    function enviarComandoAmiti(textoComando) {
        if (!textoComando.trim()) return;

        // --- TRUCO CRÍTICO PARA MÓVILES ---
        // Al ejecutarse síncronamente al tocar el botón, desbloquea el canal de audio del navegador
        if ('speechSynthesis' in window) {
            let dummy = new SpeechSynthesisUtterance("");
            window.speechSynthesis.speak(dummy);
        }

        fetch('/enviar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'comando=' + encodeURIComponent(textoComando)
        })
        .then(res => res.json())
        .then(data => {
            // Mostrar texto en la interfaz visual
            if (typeof imprimirEnTerminal === 'function') {
                imprimirEnTerminal(data.respuesta);
            }
            
            // Actualizar telemetría de progreso del núcleo
            if (typeof actualizarCirculoProgreso === 'function') {
                actualizarCirculoProgreso(data.progreso);
            }
            
            // Amiti habla de inmediato con la voz sintetizada
            hablarTextoConNucleo(data.respuesta, data.identidad);
        })
        .catch(err => console.error("Error en enlace con el núcleo:", err));
    }
</script>
