<!-- Carga de librerías para Leaflet Map (Colocar preferiblemente en el <head> de tu HTML) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- 1. BOTÓN DE DIAGNÓSTICO -->
<button onclick="diagnosticoVoz()" style="width: 100%; padding: 15px; background-color: #ff0055; color: white; font-weight: bold; border: none; border-radius: 10px; margin-bottom: 15px; font-size: 16px;">
    🔊 FORZAR DIAGNÓSTICO DE VOZ
</button>

<script>
function diagnosticoVoz() {
    if (!('speechSynthesis' in window)) {
        alert("Tu navegador no soporta voces nativas.");
        return;
    }
    window.speechSynthesis.cancel();
    let msg = new SpeechSynthesisUtterance("Diagnóstico de hardware completado con éxito. Amiti te escucha.");
    msg.lang = 'es-ES';
    msg.pitch = 1.2;
    window.speechSynthesis.speak(msg);
    alert("Comando enviado al parlante. Si no escuchaste nada, el navegador tiene bloqueado el audio.");
}
</script>
<!-- FIN DEL DIAGNÓSTICO -->

<!-- 2. PRESENTACIÓN Y NÚCLEO DE AMITI -->
<div class="amiti-leader">
    <div class="amiti-status-badge">Núcleo Activo</div>
    <span id="contador">0</span> min
</div>

<!-- CONTENEDOR DEL MAPA (Oculto por defecto, se activa solo con comando) -->
<div id="mapa-amiti-container" style="display: none; width: 100%; border-radius: 12px; overflow: hidden; border: 1px solid #30363d; margin: 15px 0; background: #0d1117;">
    <div id="mapa-header" style="background: #161b22; padding: 10px; color: #58a6ff; font-weight: bold; font-size: 13px; border-bottom: 1px solid #30363d;">
        🗺️ UBICACIÓN EN TIEMPO REAL - AMITI GPS
    </div>
    <div id="map" style="width: 100%; height: 280px;"></div>
</div>

<!-- REPRODUCTOR INVISIBLE DE AMITI -->
<audio id="amiti-reproductor" style="display: none;"></audio>

<script>
    // Variable global para controlar la instancia del mapa
    let mapaAmiti = null;
    let marcadorUsuario = null;

    // 1. Temporizador de inteligencia activo
    const startTime = new Date();
    setInterval(() => {
        let mins = Math.floor((new Date() - startTime) / 60000);
        let contadorElem = document.getElementById('contador');
        if (contadorElem) {
            contadorElem.innerText = mins;
        }
    }, 10000);

    // 2. Módulo de voz por servidor (Streaming directo)
    function hablarTextoConNucleo(texto, datosIdentidad) {
        let textoPlano = texto
            .replace(/\[.*?\]/g, '')
            .replace(/[*_~`\\]/g, '')
            .replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, '')
            .replace(/[🗣️🔊✨🔒🤖]/g, '')
            .trim();

        if (!textoPlano) return;

        let textoCodificado = encodeURIComponent(textoPlano);
        let urlAudio = `https://translate.google.com/translate_tts?ie=UTF-8&q=${textoCodificado}&tl=es&client=tw-ob`;

        let reproductor = document.getElementById("amiti-reproductor");
        if (reproductor) {
            reproductor.src = urlAudio;
            reproductor.play().catch(error => {
                console.log("Reproducción de audio bloqueada por el navegador:", error);
            });
        }
    }

    // Forzar la carga de voces del sistema operativo móvil
    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };
    }

    // 3. Módulo del Mapa de Ubicación GPS en Tiempo Real
    function cargarMapaUbicacion() {
        let contenedorMapa = document.getElementById('mapa-amiti-container');
        if (contenedorMapa) {
            contenedorMapa.style.display = 'block';
        }

        if (!mapaAmiti) {
            mapaAmiti = L.map('map').setView([0, 0], 2);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(mapaAmiti);
        }

        // Forzar actualización de tamaño para evitar descuadres en pantalla móvil
        setTimeout(() => {
            mapaAmiti.invalidateSize();
        }, 300);

        // Obtener ubicación GPS real desde el teléfono Android
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (posicion) => {
                    const lat = posicion.coords.latitude;
                    const lon = posicion.coords.longitude;

                    // Formatear Fecha y Hora local exacta
                    const ahora = new Date();
                    const fechaStr = ahora.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
                    const horaStr = ahora.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                    const contenidoPopup = `
                        <div style="font-family: sans-serif; font-size: 12px; color: #111;">
                            <b style="color: #0055ff;">📍 Ubicación del Dispositivo</b><br>
                            <b>📅 Fecha:</b> ${fechaStr}<br>
                            <b>⏰ Hora:</b> ${horaStr}<br>
                            <b>🌐 Lat:</b> ${lat.toFixed(5)} | <b>Lon:</b> ${lon.toFixed(5)}
                        </div>
                    `;

                    mapaAmiti.setView([lat, lon], 16);

                    if (marcadorUsuario) {
                        marcadorUsuario.setLatLng([lat, lon]).setPopupContent(contenidoPopup).openPopup();
                    } else {
                        marcadorUsuario = L.marker([lat, lon]).addTo(mapaAmiti)
                            .bindPopup(contenidoPopup)
                            .openPopup();
                    }

                    enviarCoordenadasAlServidor(lat, lon);
                },
                (error) => {
                    console.warn("Permiso de ubicación denegado o no disponible:", error.message);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }
    }

    // Envío de coordenadas al backend en Python (app.py)
    function enviarCoordenadasAlServidor(latitud, longitud) {
        fetch('/guardar_ubicacion', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ lat: latitud, lon: longitud })
        })
        .then(res => res.json())
        .then(data => console.log("Telemetría de ubicación sincronizada:", data))
        .catch(err => console.error("Error al enviar ubicación al núcleo:", err));
    }

    // Validación flexible de intenciones de ubicación (Tolera errores de ortografía y espacios)
function evaluarComandoUbicacion(comando) {
    let cmd = comando.toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // Elimina acentos
        .trim();
        
    return cmd.includes("mapa") || 
           cmd.includes("donde estoy") || 
           cmd.includes("donde me encuentro") || 
           cmd.includes("ubicacion");
}
    // 4. Función central con TRUCO MÓVIL y Filtro de Ubicación
    function enviarComandoAmiti(textoComando) {
        if (!textoComando.trim()) return;

        // Si el usuario envía alguno de los 3 comandos de ubicación, activa el mapa GPS
        if (evaluarComandoUbicacion(textoComando)) {
            cargarMapaUbicacion();
        }

        // --- TRUCO CRÍTICO PARA MÓVILES (Desbloqueo Asíncrono) ---
        if ('speechSynthesis' in window) {
            let dummy = new SpeechSynthesisUtterance("");
            window.speechSynthesis.speak(dummy);
        }
        
        let reproductor = document.getElementById("amiti-reproductor");
        if (reproductor) {
            reproductor.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA"; 
            reproductor.play().catch(e => console.log("Silencio inicial bloqueado"));
        }

        fetch('/enviar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'comando=' + encodeURIComponent(textoComando)
        })
        .then(res => res.json())
        .then(data => {
            if (typeof imprimirEnTerminal === 'function') {
                imprimirEnTerminal(data.respuesta);
            }
            
            if (typeof actualizarCirculoProgreso === 'function') {
                actualizarCirculoProgreso(data.progreso);
            }
            
            hablarTextoConNucleo(data.respuesta, data.identidad);
        })
        .catch(err => console.error("Error en enlace con el núcleo:", err));
    }
            </script>
