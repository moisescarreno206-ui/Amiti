<div class="amiti-loader">
    <span id="contador">0</span> min
</div>

<script>
    // 1. Temporizador de inteligencia activo
    const startTime = new Date();
    setInterval(() => {
        let mins = Math.floor((new Date() - startTime) / 60000);
        let contadorElem = document.getElementById('contador');
        if (contadorElem) {
            contadorElem.innerText = mins;
        }
    }, 10000);

    // 2. Módulo de voz sincronizado con los parámetros del núcleo base
    function hablarTextoConNucleo(texto, datosIdentidad) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();

            let textoPlano = texto.replace(/[*#`_\[\]]/g, '').replace(/\[.*?\]/g, '');
            let mensaje = new SpeechSynthesisUtterance(textoPlano);
            mensaje.lang = 'es-ES';
            mensaje.rate = 1.0;
            
            // Ajuste dinámico de tono dictado por el backend
            mensaje.pitch = datosIdentidad && datosIdentidad.genero === "Femenino" ? 1.2 : 1.0;

            let voces = window.speechSynthesis.getVoices();
            let vozFemenina = voces.find(v => v.lang.startsWith('es') && (v.name.includes('Female') || v.name.includes('Helena') || v.name.includes('Laura') || v.name.includes('Monica')));
            
            if (vozFemenina) {
                mensaje.voice = vozFemenina;
            }

            window.speechSynthesis.resume();
            window.speechSynthesis.speak(mensaje);
        }
    }

    // Precarga de voces móviles
    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };
    }

    // 3. Función central de comunicación asíncrona con el servidor
    function enviarComandoAmiti(textoComando) {
        fetch('/enviar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'comando=' + encodeURIComponent(textoComando)
        })
        .then(res => res.json())
        .then(data => {
            // Mostrar texto en la interfaz visual
            if (typeof imprimirEnTerminal === 'function') {
                imprimirEnTerminal(data.respuesta);
            }
            
            // Actualizar telemetría de progreso del núcleo
            if (typeof actualizarCirculoProgreso === 'function') {
                actualizarCirculoProgreso(data.progreso);
            }
            
            // Amiti emite su respuesta con voz nativa usando su propia identidad base
            hablarTextoConNucleo(data.respuesta, data.identidad);
        })
        .catch(err => console.error("Error en enlace con el núcleo:", err));
    }
</script>
