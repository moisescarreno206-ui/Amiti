<div class="amiti-loader">
    <span id="contador">0</span> min
</div>

<script>
    // 1. Temporizador de inteligencia activo
    const startTime = new Date();
    setInterval(() => {
        let mins = Math.floor((new Date() - startTime) / 60000);
        let contadorElem = document.getElementById('contador');
        if (contadorElem) {
            contadorElem.innerText = mins;
        }
    }, 10000);

    // 2. Módulo de voz robusto (Blinda contra emojis y símbolos para móviles)
    function hablarTextoConNucleo(texto, datosIdentidad) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();

            // LIMPIEZA TOTAL: Elimina corchetes, Markdown y TODOS los emojis o símbolos gráficos que silencian Android
            let textoPlano = texto
                .replace(/\[.*?\]/g, '') // Elimina bloques entre corchetes
                .replace(/[*#`_\[\]()]/g, '') // Elimina caracteres markdown
                .replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, '') // Elimina emojis universales
                .replace(/[🔑🌙⚡💾⚙️✨🔹📌💻]/g, '') // Filtro de respaldo para emojis específicos de Amiti
                .trim();

            if (!textoPlano) return; // Si no queda texto legible, no ejecuta

            let mensaje = new SpeechSynthesisUtterance(textoPlano);
            mensaje.lang = 'es-ES';
            mensaje.rate = 1.0;
            
            // Ajuste dinámico de tono dictado por el núcleo (Femenino / 1.2)
            mensaje.pitch = datosIdentidad && datosIdentidad.genero === "Femenino" ? 1.2 : 1.0;

            let voces = window.speechSynthesis.getVoices();
            let vozFemenina = voces.find(v => v.lang.startsWith('es') && (v.name.includes('Female') || v.name.includes('Helena') || v.name.includes('Laura') || v.name.includes('Monica') || v.name.includes('Lucia')));
            
            if (vozFemenina) {
                mensaje.voice = vozFemenina;
            }

            // Forzar activación de audio en el entorno móvil
            window.speechSynthesis.resume();
            window.speechSynthesis.speak(mensaje);
        }
    }

    // Precarga obligatoria de voces en dispositivos móviles
    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };
    }

    // 3. Función central de comunicación asíncrona con el servidor
    function enviarComandoAmiti(textoComando) {
        fetch('/enviar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'comando=' + encodeURIComponent(textoComando)
        })
        .then(res => res.json())
        .then(data => {
            // Mostrar texto completo con emojis en la interfaz visual de la terminal
            if (typeof imprimirEnTerminal === 'function') {
                imprimirEnTerminal(data.respuesta);
            }
            
            // Actualizar telemetría de progreso del núcleo
            if (typeof actualizarCirculoProgreso === 'function') {
                actualizarCirculoProgreso(data.progreso);
            }
            
            // Amiti habla limpiando los emojis automáticamente
            hablarTextoConNucleo(data.respuesta, data.identidad);
        })
        .catch(err => console.error("Error en enlace con el núcleo:", err));
    }
</script>
