name: Project Amiti - Integración Continua (CI/CD)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar código fuente
      uses: actions/checkout@v3

    - name: Configurar Entorno Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Verificación de Sintaxis y Compilación de Núcleos
      run: |
        python -m py_compile nucleos/amiti_os.py
        echo "✅ Núcleo de Amiti validado correctamente sin errores de sintaxis."
        
